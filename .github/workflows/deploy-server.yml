# 서버 배포: main 의 server/ 가 바뀌면 → 테스트 → Docker 이미지(GHCR) → EC2 에서 새 이미지로 재시작
# 필요한 설정은 docs/deploy.md 참고
name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

# 배포가 겹치면 먼저 시작한 것을 끝까지 하고 다음 것을 실행
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # GHCR 이미지 이름은 소문자여야 함
  IMAGE: ghcr.io/nyangpang/service-server

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: EC2 에서 새 이미지로 재시작
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_FILE: ${{ vars.SERVER_ENV_FILE || '/home/ubuntu/itda/.env' }}
          CONTAINER: ${{ vars.SERVER_CONTAINER || 'itda-server' }}
          HOST_PORT: ${{ vars.SERVER_HOST_PORT || '8080' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,ENV_FILE,CONTAINER,HOST_PORT
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE_TAG"
            docker logout ghcr.io

            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d --name "$CONTAINER" --restart unless-stopped \
              -p "$HOST_PORT:8080" --env-file "$ENV_FILE" "$IMAGE_TAG"

            # 뜰 때까지 최대 2분 대기 (로그인 없이 되는 GET 으로 확인)
            for i in $(seq 1 24); do
              if curl -fsS "http://localhost:$HOST_PORT/api/stores/categories" > /dev/null; then
                echo "서버 정상 기동"
                docker image prune -af --filter "until=72h" > /dev/null || true
                exit 0
              fi
              sleep 5
            done
            echo "서버가 2분 안에 뜨지 않음 — 최근 로그:"
            docker logs --tail 80 "$CONTAINER"
            exit 1
