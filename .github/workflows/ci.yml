# PR·브랜치 검사: 서버 테스트 + 프론트 타입검사·린트·빌드. 배포는 하지 않음
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main 은 deploy-* 워크플로가 빌드하면서 검사

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # gradlew 가 실행 권한 없이 커밋돼 있음
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
