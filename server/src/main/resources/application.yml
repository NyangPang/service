spring:
  application:
    name: itda
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # server/.env 가 있으면 읽어온다 (없으면 OS 환경변수만 사용)
  config:
    import: optional:file:.env[.properties]


  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # 리뷰 영상(최대 50MB) + 사진 2장이 한 요청에 올 수 있음
      max-file-size: 60MB
      max-request-size: 80MB

  # 회원가입 인증 메일 (SMTP). MAIL_HOST 가 비어 있으면 메일을 보내지 않고 로그에만 남김
  # 예) Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=주소, MAIL_PASSWORD=앱 비밀번호(16자리)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

  ai:
    model:
      # 글 생성(메뉴판 인식·스토리보드·소개 글)을 어디로 보낼지
      #   bedrock-converse → AWS Bedrock (BEDROCK_MODEL_ID 필요) — 기본
      #   anthropic        → Anthropic API 직접 (ANTHROPIC_API_KEY 필요) — Bedrock이 막혔을 때 대안
      chat: ${AI_CHAT_PROVIDER:bedrock-converse}
    anthropic:
      # 키가 없어도 서버는 뜨고, AI를 부를 때만 인증 오류가 남 (AI 안 쓰는 팀원도 개발 가능하게)
      api-key: ${ANTHROPIC_API_KEY:no-key-set}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
          # 생각 + JSON 응답이 잘리지 않을 만큼 (Spring AI 기본값 4096은 부족할 수 있음)
          max-tokens: 16000
    bedrock:
      aws:
        region: ${AWS_REGION:ap-northeast-2}
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      converse:
        chat:
          options:
            model: ${BEDROCK_MODEL_ID}
            # 생각 + JSON 응답이 잘리지 않을 만큼 (비워 두면 모델 기본값이라 짧을 수 있음)
            max-tokens: 16000

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
    presigned-url-expiration-minutes: 10
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}
  polly:
    voice-id: ${AWS_POLLY_VOICE_ID:Seoyeon}
    # 인물 소개·신메뉴 알림 영상의 남자 목소리 (Hyunduk은 generative 엔진에서만 됨)
    male-voice-id: ${AWS_POLLY_MALE_VOICE_ID:Hyunduk}
    male-engine: ${AWS_POLLY_MALE_ENGINE:generative}

video:
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  work-dir: ${VIDEO_WORK_DIR:./tmp/video}
  # 장면 JSON 영상의 내레이션: auto(ElevenLabs 키 → AWS 키(Polly) → macOS say → 무음 순) / elevenlabs / polly / say / none
  tts: ${VIDEO_TTS:auto}

email-verification:
  # 보내는 사람 주소 (비우면 MAIL_USERNAME)
  from: ${MAIL_FROM:${MAIL_USERNAME:}}
  # 받은 메일함에 보이는 보내는 사람 이름
  from-name: ${MAIL_FROM_NAME:잇츠}
  # 메일 서버가 없을 때 인증번호를 응답(devCode)에 담을지 — 운영에선 false
  expose-code: false

# 시연용 샘플 가게 125곳 + 영상 게시물 (SampleStoreInitializer). 운영은 EC2 .env 에 SAMPLE_DATA_ENABLED=true 로 켬
sample-data:
  enabled: ${SAMPLE_DATA_ENABLED:false}

quest:
  # 방문 인증 GPS 반경 검사를 건너뜀 (개발·시연용, 운영은 false)
  gps-bypass: ${QUEST_GPS_BYPASS:false}
  # 가게 방문 QR 값을 만드는 비밀값 (없으면 JWT 비밀값 사용)
  qr-secret: ${QUEST_QR_SECRET:${jwt.secret}}

unsplash:
  access-key: ${UNSPLASH_ACCESS_KEY}

runway:
  api-key: ${RUNWAYML_API_SECRET:${RUNWAY_API_KEY:}}

generation:
  video:
    # motion=ai 장면과 사진이 없을 때의 메뉴 이미지에 Runway 크레딧을 쓴다 (false면 줌 효과로 대체, 무료)
    runway: ${GENERATION_RUNWAY:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
