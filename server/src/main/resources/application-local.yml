spring:
  datasource:
    # DB_CLOSE_DELAY=-1: 연결이 모두 끊겨도(PC 잠자기 등) 서버가 켜져 있는 동안 DB 유지
    url: jdbc:h2:mem:itda;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  # 로컬: AWS 키가 없어도 서버가 뜨게 기본값을 둠 (AI 생성·사진 업로드만 실패하고 나머지는 동작)
  # 실제 키는 server/.env 에 넣으면 그 값을 씀
  ai:
    bedrock:
      aws:
        access-key: ${AWS_ACCESS_KEY_ID:local-dummy}
        secret-key: ${AWS_SECRET_ACCESS_KEY:local-dummy}
      converse:
        chat:
          options:
            model: ${BEDROCK_MODEL_ID:local-dummy}

# 로컬 전용 기본값 — 운영(prod)에서는 반드시 환경변수로 넣어야 함
jwt:
  secret: ${JWT_SECRET:local-only-jwt-secret-do-not-use-in-prod-0123456789}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:local-dummy}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN:localhost}

unsplash:
  access-key: ${UNSPLASH_ACCESS_KEY:}

# 로컬: 메일 서버(MAIL_HOST) 없이도 가입 테스트가 되게 인증번호를 응답 devCode 로 줌
email-verification:
  expose-code: true

# 로컬: 샘플 가게 125곳 + 영상 게시물을 기본으로 넣음
sample-data:
  enabled: ${SAMPLE_DATA_ENABLED:true}

# 로컬: 집에서도 방문 인증을 해 볼 수 있게 GPS 반경 검사를 건너뜀
quest:
  gps-bypass: ${QUEST_GPS_BYPASS:true}
