plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.commicom'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    springAiVersion = '2.0.0'
    awsSdkVersion = '2.41.22' // spring-ai 2.0.0 의 bedrockruntime 버전과 맞춤
    jjwtVersion = '0.12.6'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
    }
}

dependencies {
    // Web / Security / Validation
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 회원가입 이메일 인증번호 발송 (SMTP)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-h2console'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // API 문서
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    // AI (Bedrock Converse + Image) / AWS (S3, Polly)
    implementation 'org.springframework.ai:spring-ai-starter-model-bedrock-converse'
    // AI (Anthropic API 직접 연결) — 둘 중 무엇을 쓸지는 spring.ai.model.chat 으로 고름
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:polly'
    implementation 'software.amazon.awssdk:bedrockruntime'

    // 네이버 장소 스크래핑
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.microsoft.playwright:playwright:1.55.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 장면 JSON → mp4 (B 파트). 사용법은 StoryboardCli 주석, docs/video-pipeline.md 참고
// ./gradlew renderStoryboard --args="--storyboard docs/storyboard-samples/02-cafe.storyboard.json --photos a.png,b.png --out build/video/cafe.mp4"
tasks.register('renderStoryboard', JavaExec) {
    group = 'video'
    description = '장면 JSON + 사진 → 세로 mp4'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.commicom.itda.infra.video.storyboard.StoryboardCli'
    workingDir = projectDir
    jvmArgs '-Djava.awt.headless=true'
}

// 메뉴 데이터 image_requests → Runway 이미지 생성 (B 파트). 사용법은 MenuImageCli 주석 참고
tasks.register('generateMenuImages', JavaExec) {
    group = 'video'
    description = '메뉴 데이터의 이미지 요청 → Runway 이미지'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.commicom.itda.infra.video.storyboard.MenuImageCli'
    workingDir = projectDir
}
